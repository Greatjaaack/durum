# Продакшен-конфигурация (самодостаточная, НЕ overlay к docker-compose.yml).
#
# ВАЖНО: на сервере уже работает Caddy от проекта аналитики (dashboards-caddy-1),
# он держит порты 80/443. Второй Caddy эти порты занять не сможет, поэтому здесь
# СВОЕГО Caddy нет — дашборд бота подключается к сети аналитики, а тот Caddy
# проксирует на него домен bot.iskendy.ru (см. DEPLOY.md → "Общий reverse-proxy").
#
# Отличия от dev:
#   - dashboard наружу НЕ публикуется (expose, не ports) — доступен только через
#     общий Caddy по 443; пароль дашборда не летит по сети открытым текстом;
#   - dashboard подключён к внешней сети аналитики, чтобы Caddy резолвил его по имени;
#   - тома data/logs общие с dev-конфигом (имя проекта = имя папки), данные не теряются.
#
# Запуск:  docker compose -f docker-compose.prod.yml up -d --build
# Предварительно: внешняя сеть аналитики должна существовать (обычно dashboards_default).
services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/shifts.db
      MEDIA_DIR: /data/media
      LOG_DIR: /app/logs
      TZ: ${BOT_TIMEZONE:-Europe/Moscow}
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/shifts.db
      MEDIA_DIR: /data/media
      TZ: ${BOT_TIMEZONE:-Europe/Moscow}
      # За Caddy всегда HTTPS — выставляем cookie сессии с флагом Secure.
      DASHBOARD_COOKIE_SECURE: "true"
    command: ["python", "-m", "uvicorn", "app.dashboard:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    expose:
      - "8000"
    networks:
      - default        # общий том/связь с bot
      - proxy          # сеть, где живёт Caddy аналитики
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Внешняя сеть, созданная проектом аналитики. Имя проверить: docker network ls
  # (обычно <папка_аналитики>_default, например dashboards_default).
  proxy:
    external: true
    name: dashboards_default
